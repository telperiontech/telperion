<section class="mx-auto mt-24 max-w-sm rounded-lg border border-neutral-200 bg-white p-6 shadow-sm dark:border-neutral-800 dark:bg-neutral-900">
  <h1 class="mb-4 text-lg font-semibold">Log in to Beacon</h1>
  <form class="flex flex-col gap-4" (tngValidSubmit)="submits.next($event)" [tngValidSubmitShape]="{ password: 'string' }">
    <tui-field label="Admin password">
      <input type="password" name="password" ngModel required autocomplete="current-password" />
    </tui-field>
    <button
      type="submit"
      class="rounded-md bg-primary px-4 py-2 font-medium text-white disabled:opacity-50"
      [disabled]="state() === 'busy'"
    >
      Log in
    </button>
    @if (state() === 'wrong') {
      <p class="text-sm text-danger" role="alert">Wrong password.</p>
    } @else if (state() === 'error') {
      <p class="text-sm text-danger" role="alert">Beacon did not answer. Try again.</p>
    }
  </form>
</section>
