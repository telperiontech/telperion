<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Telperion Open Source</title>
  <meta name="description" content="Open-source TypeScript utilities, web components, Angular and React building blocks, and developer infrastructure by Telperion." />
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f3f3f3" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400..600&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
</head>

<body class="bg-white font-sans text-neutral-990">
  <tha-router>
    <tha-route path="/">
      <template>
        <osw-home></osw-home>
      </template>
    </tha-route>
    <tha-route path="*">
      <template>
        <main class="min-h-screen grid place-items-center px-4">
          <div class="text-center">
            <p class="font-mono text-sm font-semibold text-primary-600">404</p>
            <h1 class="mt-3 text-3xl font-semibold tracking-tight sm:text-4xl">Page not found</h1>
            <p class="mt-4 text-neutral-920">This branch of the tree doesn't exist (yet).</p>
            <div class="mt-8 flex flex-wrap justify-center gap-3">
              <a href="/" class="rounded-lg bg-primary-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-primary-700 transition-colors">Browse libraries</a>
              <a href="https://telperion.tr/en/" class="rounded-lg border border-neutral-100 bg-white px-4 py-2.5 text-sm font-semibold text-neutral-990 hover:border-neutral-250 transition-colors">Go to telperion.tr</a>
            </div>
          </div>
        </main>
      </template>
    </tha-route>
    <tha-router-outlet></tha-router-outlet>
  </tha-router>
</body>

</html>
