# Local development tunnel for the osw apps. Start it with `nx run osw:mediator` (project name: osw),
# which writes .mediator/frpc.toml from the Nx workspace first; `docker compose up` alone has no config.
#
# frpc publishes the dev servers running on the host (shell :10500, home :10501, docs remotes :105xx) as
# https://[<remote>.]<device>.<user>.<OSW_DEV_ZONE> via frp-gate. TLS ends at the gateway. The frp-gate
# server, the zone and your identity all come from ../../.workspace/dev.env.
#
# Note: `docker compose config` inlines env_file values and therefore prints your frp-gate token.
# Use `docker compose config --quiet` to validate.

name: osw

services:
  frpc:
    image: ghcr.io/telperiontech/docker-frp:1.3.2-client
    container_name: osw-frpc
    env_file:
      - path: ../../.workspace/dev.env
        required: true
    volumes:
      - ./.mediator/frpc.toml:/app/configs/frpc.toml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
