# frp-gate's declarative config (FRP_GATE_CONFIG). Keep it in git: it is
# applied at every start, so a lost database is rebuilt exactly as it was.
# Change it, then run `docker compose exec frp-gate frp-gate apply` (or
# restart frp-gate). Preview with `frp-gate apply --dry-run`.
#
# Everything here is "managed": the admin UI shows it but does not let you
# edit or delete it. Objects you make in the UI are never touched by apply.
# Every name used below must be declared in this file.

zones: [dev.example.com]

instances:
  # Its plugin key comes from FRP_GATE_INSTANCE_KEY (see compose.yml), so no
  # key_env here. A second frps would need key_env, key_file or key_sha256.
  default: { server_addr: gateway.example.com:7000, zones: [dev.example.com] }

groups: [videochat]

clients:
  sahin:
    note: laptop
    groups: [videochat]
    # The token is read from frp-gate's environment and never printed. Make
    # one with: echo "fg_$(openssl rand -hex 26)"
    token_env: FRP_GATE_TOKEN_SAHIN
  home-pi:
    note: Raspberry Pi frpc
    token_env: FRP_GATE_TOKEN_HOME_PI    # or token_file: /run/secrets/..., or token_sha256: <hex>
    # disabled: true                     # only applied when written; the UI's Disable survives otherwise

grants:
  # Every member of videochat gets <anything>.<own name>.dev.example.com.
  - { group: videochat, kind: host, zone: dev.example.com, pattern: "*.{client}" }
  # home-pi may use any name in the zone and tcp port 25565 (also open it in
  # frps allowPorts and the firewall: frp-gate cannot check those).
  - { client: home-pi, kind: host, zone: dev.example.com, pattern: "*" }
  - { client: home-pi, kind: port, instance: default, proto: tcp, ports: "25565" }
