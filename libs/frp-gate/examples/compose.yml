# A complete gateway: Caddy (HTTPS) + frps + frp-gate.
# Copy this folder to the server, create .env from .env.example, then:
#   docker compose up -d
services:
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  frps:
    image: ghcr.io/telperiontech/docker-frp:1.3.0-server
    restart: unless-stopped
    environment:
      # Read by frps.toml through {{ .Envs.FRP_GATE_INSTANCE_KEY }}.
      FRP_GATE_INSTANCE_KEY: ${FRP_GATE_INSTANCE_KEY:?set it in .env}
    ports:
      - "7000:7000"           # frpc connects here
      # - "25565:25565"       # only for port grants (see frp-gate.yaml)
    volumes:
      - ./frps:/app/configs:ro
    depends_on: [frp-gate]

  frp-gate:
    image: ghcr.io/telperiontech/frp-gate:1.1.0
    restart: unless-stopped
    environment:
      FRP_GATE_ADMIN_PASSWORD: ${FRP_GATE_ADMIN_PASSWORD:?set it in .env}
      FRP_GATE_INSTANCE_KEY: ${FRP_GATE_INSTANCE_KEY:?set it in .env}
      FRP_GATE_INSTANCE_SERVER_ADDR: ${FRP_GATE_PUBLIC_ADDR:-gateway.example.com:7000}
      # Applied at every start; `frp-gate apply` applies it on demand.
      FRP_GATE_CONFIG: /config/frp-gate.yaml
      # Client tokens referenced by token_env in frp-gate.yaml.
      FRP_GATE_TOKEN_ALICE: ${FRP_GATE_TOKEN_ALICE:?set it in .env}
      FRP_GATE_TOKEN_HOME_PI: ${FRP_GATE_TOKEN_HOME_PI:?set it in .env}
    volumes:
      - ./frp-gate.yaml:/config/frp-gate.yaml:ro
      - frp_gate_data:/data
    # No published ports: Caddy and frps reach it on the compose network.

volumes:
  caddy_data:
  caddy_config:
  frp_gate_data:
