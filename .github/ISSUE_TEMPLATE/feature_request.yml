name: ✨ Feature Request
description: Suggest a new feature or an improvement
title: '[Feature]: '
labels: ['enhancement', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please search [existing issues](https://github.com/telperiontech/telperion/issues) first to avoid duplicates.
  - type: dropdown
    id: package
    attributes:
      label: Related package
      options:
        - auto-proxy
        - docker-frp
        - dom-utils
        - elements
        - extra-ts-types
        - js-utils
        - messenger
        - ng-pack
        - ng-ui
        - node-utils
        - nx-utils
        - paintlet
        - react-utils
        - reactive-storage
        - rx-utils
        - ts-utils
        - osw (shell / home / elements / js-utils / paintlet)
        - New package
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem would this feature solve? What is the use case?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the API or behavior you would like, ideally with a code example.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'm willing to submit a pull request for this feature.
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](https://github.com/telperiontech/telperion/blob/main/CODE_OF_CONDUCT.md).
          required: true
