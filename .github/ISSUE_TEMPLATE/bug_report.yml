name: 🐛 Bug Report
description: Report something that isn't working as expected
title: '[Bug]: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search [existing issues](https://github.com/telperiontech/telperion/issues) first to avoid duplicates.

        **Do not report security vulnerabilities here.** See [SECURITY.md](https://github.com/telperiontech/telperion/blob/main/SECURITY.md) instead.
  - type: dropdown
    id: package
    attributes:
      label: Affected package
      description: Which package is affected?
      options:
        - auto-proxy
        - docker-frp
        - dom-utils
        - elements
        - extra-ts-types
        - js-utils
        - messenger
        - ng-pack
        - ng-ui
        - node-utils
        - nx-utils
        - paintlet
        - react-utils
        - reactive-storage
        - rx-utils
        - ts-utils
        - osw (shell / home / elements / js-utils / paintlet)
        - Other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: e.g. 1.2.3
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal code snippet or a link to a reproduction (StackBlitz, CodeSandbox, repository).
      placeholder: |
        1. Install ...
        2. Call ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages and stack traces if available.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Runtime, browser, framework and OS versions where relevant.
      placeholder: |
        - Node.js: 22.13
        - Browser: Chrome 130
        - Framework: Angular 20 / React 18
        - OS: Windows 11
  - type: textarea
    id: additional
    attributes:
      label: Additional context
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](https://github.com/telperiontech/telperion/blob/main/CODE_OF_CONDUCT.md).
          required: true
