name: OSW / Dom Utils Docs / Publish

# Deploys the dom-utils docs remote (https://open-source.telperion.tr/dom-utils).
# - Called by dom-utils.publish.yml after every npm release, with that release's version.
# - Pushing an `osw-dom-utils-vX.Y.Z` tag redeploys UI-only changes; the version shown is
#   then the latest `dom-utils-v*` tag.

on:
  push:
    tags:
      - 'osw-dom-utils-v[0-9]+.[0-9]+.[0-9]+'
  workflow_call:
    inputs:
      package-version:
        description: dom-utils version the docs are generated for
        required: true
        type: string

jobs:
  deploy:
    uses: ./.github/workflows/osw-deploy.yml
    permissions:
      contents: read
      deployments: write
    with:
      project: osw/dom-utils
      site: osw-dom-utils
      package-version: ${{ inputs.package-version }}
    secrets: inherit
