name: OSW / Paintlet Docs / Publish

# Deploys the paintlet docs remote (https://open-source.telperion.tr/paintlet).
# - Called by paintlet.publish.yml after every npm release, with that release's version.
# - Pushing an `osw-paintlet-vX.Y.Z` tag redeploys UI-only changes; the version shown is
#   then the latest `paintlet-v*` tag.

on:
  push:
    tags:
      - 'osw-paintlet-v[0-9]+.[0-9]+.[0-9]+'
  workflow_call:
    inputs:
      package-version:
        description: paintlet version the docs are generated for
        required: true
        type: string

jobs:
  deploy:
    uses: ./.github/workflows/osw-deploy.yml
    permissions:
      contents: read
      deployments: write
    with:
      project: osw/paintlet
      site: osw-paintlet
      package-version: ${{ inputs.package-version }}
    secrets: inherit
