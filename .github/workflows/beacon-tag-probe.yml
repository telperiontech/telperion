name: Beacon / Tag trigger probe

# Target of apps/beacon/scripts/verify-app-tag-trigger.mjs: it creates throwaway
# beacon-probe-* tags with a GitHub App installation token (Releases API and Git
# refs API) and checks that each one starts this workflow. Publishes nothing.
on:
  push:
    tags:
      - 'beacon-probe-*'

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report the trigger
        env:
          TAG: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: echo "push of tag ${TAG} by ${ACTOR} (triggering actor ${TRIGGERING_ACTOR})"
