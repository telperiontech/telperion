name: OSW / Js Utils Docs / Publish

# Deploys the js-utils docs remote (https://open-source.telperion.tr/js-utils).
# - Called by js-utils.publish.yml after every npm release, with that release's version.
# - Pushing an `osw-js-utils-vX.Y.Z` tag redeploys UI-only changes; the version shown is
#   then the latest `js-utils-v*` tag.

on:
  push:
    tags:
      - 'osw-js-utils-v[0-9]+.[0-9]+.[0-9]+'
  workflow_call:
    inputs:
      package-version:
        description: js-utils version the docs are generated for
        required: true
        type: string

jobs:
  deploy:
    uses: ./.github/workflows/osw-deploy.yml
    permissions:
      contents: read
      deployments: write
    with:
      project: osw/js-utils
      site: osw-js-utils
      package-version: ${{ inputs.package-version }}
    secrets: inherit
