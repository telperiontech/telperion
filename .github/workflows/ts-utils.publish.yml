name: Ts Utils / Publish

on:
  push:
    tags:
      - 'ts-utils-v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Set package version env variable
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#ts-utils-v}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # - name: Test
      #   run: pnpm nx run ts-utils:test

      - name: Publish
        run: pnpm nx run ts-utils:publish
