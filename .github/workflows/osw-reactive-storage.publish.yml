name: OSW / Reactive Storage Docs / Publish

# Deploys the reactive-storage docs remote (https://open-source.telperion.tr/reactive-storage).
# - Called by reactive-storage.publish.yml after every npm release, with that release's version.
# - Pushing an `osw-reactive-storage-vX.Y.Z` tag redeploys UI-only changes; the version shown is
#   then the latest `reactive-storage-v*` tag.

on:
  push:
    tags:
      - 'osw-reactive-storage-v[0-9]+.[0-9]+.[0-9]+'
  workflow_call:
    inputs:
      package-version:
        description: reactive-storage version the docs are generated for
        required: true
        type: string

jobs:
  deploy:
    uses: ./.github/workflows/osw-deploy.yml
    permissions:
      contents: read
      deployments: write
    with:
      project: osw/reactive-storage
      site: osw-reactive-storage
      package-version: ${{ inputs.package-version }}
    secrets: inherit
