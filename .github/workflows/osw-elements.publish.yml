name: OSW / Elements Docs / Publish

# Deploys the elements docs remote (https://open-source.telperion.tr/elements).
# - Called by elements.publish.yml after every npm release, with that release's version.
# - Pushing an `osw-elements-vX.Y.Z` tag redeploys UI-only changes; the version shown is
#   then the latest `elements-v*` tag.

on:
  push:
    tags:
      - 'osw-elements-v[0-9]+.[0-9]+.[0-9]+'
  workflow_call:
    inputs:
      package-version:
        description: elements version the docs are built for
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tags are needed to resolve the latest elements version on tag-triggered runs
          fetch-depth: 0
          fetch-tags: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm nx run osw/elements:build:production --skip-nx-cache
        env:
          PACKAGE_VERSION: ${{ inputs.package-version }}

      - name: Create firebase.json
        run: |
          cat > firebase.json << 'EOF'
          {
            "hosting": {
              "site": "osw-elements",
              "public": "dist/osw/elements",
              "ignore": ["firebase.json", "**/.*", "**/node_modules/**"],
              "rewrites": [
                {
                  "source": "**",
                  "destination": "/index.html"
                }
              ],
              "headers": [
                {
                  "source": "**",
                  "headers": [
                    {
                      "key": "Access-Control-Allow-Origin",
                      "value": "https://open-source.telperion.tr"
                    },
                    {
                      "key": "Access-Control-Allow-Methods",
                      "value": "GET, HEAD, OPTIONS"
                    },
                    {
                      "key": "Access-Control-Allow-Headers",
                      "value": "Content-Type"
                    }
                  ]
                },
                {
                  "source": "**/*.@(js|css|woff2|woff|ttf)",
                  "headers": [
                    {
                      "key": "Cache-Control",
                      "value": "public, max-age=31536000, immutable"
                    }
                  ]
                },
                {
                  "source": "/@(mf-manifest.json|mf-stats.json|remoteEntry.js|preview/index.html)",
                  "headers": [
                    {
                      "key": "Cache-Control",
                      "value": "no-cache"
                    }
                  ]
                }
              ]
            }
          }
          EOF

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
          target: osw-elements
