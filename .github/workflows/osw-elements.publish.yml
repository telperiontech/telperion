name: OSW / Elements Docs / Publish

# Deploys the elements docs remote (https://open-source.telperion.tr/elements).
# - Called by elements.publish.yml after every npm release, with that release's version.
# - Pushing an `osw-elements-vX.Y.Z` tag redeploys UI-only changes; the version shown is
#   then the latest `elements-v*` tag.

on:
  push:
    tags:
      - 'osw-elements-v[0-9]+.[0-9]+.[0-9]+'
  workflow_call:
    inputs:
      package-version:
        description: elements version the docs are generated for
        required: true
        type: string

jobs:
  deploy:
    uses: ./.github/workflows/osw-deploy.yml
    permissions:
      contents: read
      deployments: write
    with:
      project: osw/elements
      site: osw-elements
      package-version: ${{ inputs.package-version }}
      # The preview page is loaded in an iframe by URL, so it must not be served stale
      no-cache: preview/index.html
    secrets: inherit
