name: OSW / FRP Gate Docs / Publish

# Deploys the frp-gate docs remote (https://open-source.telperion.tr/frp-gate).
# - Called by frp-gate.publish.yml after every image release, with that release's version.
# - Pushing an `osw-frp-gate-vX.Y.Z` tag redeploys UI-only changes; the version shown is
#   then the latest `frp-gate-v*` tag.

on:
  push:
    tags:
      - 'osw-frp-gate-v[0-9]+.[0-9]+.[0-9]+'
  workflow_call:
    inputs:
      package-version:
        description: frp-gate version the docs are generated for
        required: true
        type: string

jobs:
  deploy:
    uses: ./.github/workflows/osw-deploy.yml
    permissions:
      contents: read
      deployments: write
    with:
      project: osw/frp-gate
      site: osw-frp-gate
      package-version: ${{ inputs.package-version }}
    secrets: inherit
