name: OSW / Ts Utils Docs / Publish

# Deploys the ts-utils docs remote (https://open-source.telperion.tr/ts-utils).
# - Called by ts-utils.publish.yml after every npm release, with that release's version.
# - Pushing an `osw-ts-utils-vX.Y.Z` tag redeploys UI-only changes; the version shown is
#   then the latest `ts-utils-v*` tag.

on:
  push:
    tags:
      - 'osw-ts-utils-v[0-9]+.[0-9]+.[0-9]+'
  workflow_call:
    inputs:
      package-version:
        description: ts-utils version the docs are generated for
        required: true
        type: string

jobs:
  deploy:
    uses: ./.github/workflows/osw-deploy.yml
    permissions:
      contents: read
      deployments: write
    with:
      project: osw/ts-utils
      site: osw-ts-utils
      package-version: ${{ inputs.package-version }}
    secrets: inherit
