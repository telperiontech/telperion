name: Elements / Publish

on:
  push:
    tags:
      - 'elements-v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.version.outputs.package-version }}

    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Set package version env variable
        id: version
        run: |
          echo "PACKAGE_VERSION=${GITHUB_REF_NAME#elements-v}" >> $GITHUB_ENV
          echo "package-version=${GITHUB_REF_NAME#elements-v}" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm config set dangerously-allow-all-builds true && pnpm install

      - name: Publish
        run: pnpm nx run elements:publish

  deploy-docs:
    needs: publish
    uses: ./.github/workflows/osw-elements.publish.yml
    permissions:
      contents: read
      deployments: write
    with:
      package-version: ${{ needs.publish.outputs.package-version }}
    secrets: inherit
