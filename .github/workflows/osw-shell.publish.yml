name: OSW / Shell / Publish

on:
  push:
    tags:
      - 'osw-shell-v[0-9]+.[0-9]+.[0-9]+'

jobs:
  deploy:
    uses: ./.github/workflows/osw-deploy.yml
    permissions:
      contents: read
      deployments: write
    with:
      project: osw/shell
      site: osw-shell
      # The host page: loaded from its own origin, never cross-origin
      remote: false
    secrets: inherit
